name: Android Release

on:
  push:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        # Check both possible secret names (Standard vs APP_ prefix)
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.APP_KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "Error: KEYSTORE_BASE64 secret is empty"
          exit 1
        fi

        # Use python for robust decoding to handle potential whitespace or formatting issues
        python3 -c "
        import os
        import base64
        import sys

        try:
            b64 = os.environ['KEYSTORE_BASE64']
            # Clean up whitespace/newlines which might break the command line tool
            b64_clean = ''.join(b64.split())

            # Decode
            decoded = base64.b64decode(b64_clean, validate=True)

            with open('keystore.jks', 'wb') as f:
                f.write(decoded)
            print('Keystore decoded successfully')

        except Exception as e:
            print(f'Error decoding keystore: {e}')
            sys.exit(1)
        "

    - name: Build Release APK and Bundle
      env:
        # Map secrets with fallback to APP_ prefixed versions
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID || secrets.APP_ADMOB_APP_ID }}
        ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID || secrets.APP_ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID || secrets.APP_ADMOB_INTERSTITIAL_ID }}

        KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.APP_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.APP_KEY_PASSWORD }}

        ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY || secrets.APP_ONESIGNAL_API_KEY }}
        ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID || secrets.APP_ONESIGNAL_APP_ID }}

        PACKAGE_NAME: ${{ secrets.PACKAGE_NAME || secrets.APP_PACKAGE_NAME }}

        # Version code/name might be vars or secrets
        VERSION_CODE: ${{ vars.VERSION_CODE || secrets.APP_VERSION_CODE || '1' }}
        VERSION_NAME: ${{ vars.VERSION_NAME || secrets.APP_VERSION_NAME || '1.0' }}
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab
