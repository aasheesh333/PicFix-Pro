name: Android Release

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
            KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.jks

      - name: Build Release APK and Bundle
        env:
            KEYSTORE_FILE: ${{ github.workspace }}/release.jks
            KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
            ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
            ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
            ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
            ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
            ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
            PACKAGE_NAME: ${{ secrets.PACKAGE_NAME }}
            VERSION_CODE: ${{ secrets.VERSION_CODE }}
            VERSION_NAME: ${{ secrets.VERSION_NAME }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
