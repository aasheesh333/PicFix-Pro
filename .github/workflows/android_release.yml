name: Android Release Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
      run: |
        echo "Checking secret length..."
        echo "Secret length: ${#APP_KEYSTORE_BASE64}"

        if [ "${#APP_KEYSTORE_BASE64}" -eq 0 ]; then
          echo "Error: APP_KEYSTORE_BASE64 secret is empty!"
          exit 1
        fi

        # Save base64 to file first to avoid pipe/shell issues
        printf "%s" "$APP_KEYSTORE_BASE64" > keystore.b64
        echo "Base64 file size: $(stat -c%s keystore.b64)"

        # Strip whitespace (using tr)
        tr -d ' \r\n' < keystore.b64 > keystore.clean.b64
        echo "Cleaned Base64 file size: $(stat -c%s keystore.clean.b64)"

        # Decode
        base64 -d keystore.clean.b64 > app/keystore.jks

        # Debug info
        ls -l app/keystore.jks
        md5sum app/keystore.jks
        file app/keystore.jks || true

        # Verify keystore validity with keytool
        keytool -list -v -keystore app/keystore.jks -storepass "$APP_KEYSTORE_PASSWORD"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK and Bundle
      env:
        APP_ADMOB_INTERSTITIAL_ID: ${{ secrets.APP_ADMOB_INTERSTITIAL_ID }}
        APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        APP_ADMOB_APP_ID: ${{ secrets.APP_ADMOB_APP_ID }}
        APP_VERSION_CODE: ${{ vars.APP_VERSION_CODE }}
        APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        APP_VERSION_NAME: ${{ vars.APP_VERSION_NAME }}
        APP_ADMOB_BANNER_ID: ${{ secrets.APP_ADMOB_BANNER_ID }}
        APP_PACKAGE_NAME: ${{ vars.APP_PACKAGE_NAME }}
        APP_ONESIGNAL_APP_ID: ${{ secrets.APP_ONESIGNAL_APP_ID }}
        APP_ONESIGNAL_API_KEY: ${{ secrets.APP_ONESIGNAL_API_KEY }}
        KEYSTORE_FILE: "keystore.jks"
      run: ./gradlew assembleRelease bundleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: release-aab
        path: app/build/outputs/bundle/release/*.aab
